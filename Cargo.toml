[package]
name = "rust-tune"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["tokio", "image"] }

# Audio
rodio = { version = "0.22.1", features = ["symphonia-all", "playback"] }
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg"] }
cpal = "0.15"

# Extra
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
iced_aw = "0.14.1"
rfd = "0.15"
dirs = "6"

[package.metadata.appimage]
name = "rust-tune"
icon = "icon.png"

auto_link = true
auto_link_exclude_list = [
    "libc.so*",
    "libdl.so*",
    "libpthread.so*",
    "libgcc_s.so*",
    "ld-linux-x86-64.so*"
]
